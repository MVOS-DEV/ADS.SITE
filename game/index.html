<!doctype html>
<html lang="pt-br">
  <head>
    <!--
      game/index.html
      - Se você abrir ESTE arquivo direto no navegador, você será enviado para o SITE (Home).
      - Na aba "Jogar", este arquivo carrega dentro de um iframe (aí o jogo aparece normalmente).

      QUANDO EXPORTAR O CONSTRUCT 3:
      1) Exporte como Web (HTML5)
      2) Copie os arquivos do export para a pasta: /game/c3/
      3) O arquivo principal do jogo deve ficar em: /game/c3/index.html
      (NÃO substitua o index.html da raiz do site!)
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Carregando jogo...</title>
    <script>
      // Abriu o jogo direto (fora do site)? Volta para a Home do site.
      if (window.top === window.self) {
        window.location.replace("../index.html");
      }
    </script>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b0d10;
        color: rgba(255, 255, 255, 0.88);
      }
      .box {
        width: min(720px, calc(100% - 28px));
        padding: 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        text-align: center;
      }
      a { color: #8be9fd; }
    </style>
  </head>
  <body>
    <div class="box">
      <p>Carregando o jogo dentro do site...</p>
      <p>Se não carregar, <a href="./c3/index.html">clique aqui</a> ou exporte o Construct 3 para <code>game/c3/</code>.</p>
    </div>

    <script>
      // Dentro do iframe (aba Jogar): tenta carregar o export do Construct em game/c3/
      if (window.top !== window.self) {
        window.location.replace("./c3/index.html");
      }
    </script>
  </body>
</html>
